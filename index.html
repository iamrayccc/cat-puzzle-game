<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>系統更新中｜貓咪解謎遊戲</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, "PingFang HK", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background:#faf6ef;
    color:#5b4a3f;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .card {
    background:#fffdf8;
    border:2px solid #ead9c2;
    border-radius:24px;
    box-shadow:0 8px 28px rgba(120,90,60,.12);
    max-width:480px;
    width:100%;
    padding:48px 32px 40px;
    text-align:center;
  }
  .cat { font-size:84px; line-height:1; margin-bottom:20px; }
  h1 {
    font-size:30px;
    font-weight:700;
    color:#4a3b30;
    margin-bottom:20px;
    letter-spacing:2px;
  }
  .divider {
    width:64px; height:4px; border-radius:2px;
    background:#f0c987;
    margin:0 auto 24px;
  }
  p {
    font-size:17px;
    line-height:1.9;
    color:#6b5a4d;
  }
  .version {
    margin-top:32px;
    font-size:12px;
    color:#b8a894;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="cat">🐱</div>
    <h1>系統更新中</h1>
    <div class="divider"></div>
    <p>親愛的玩家，系統更新中，暫時未能進入遊戲。你的遊戲進度已妥善保存，請稍後再試。多謝你的耐心等候！🐱</p>
    <div class="version">v2026.10.11.37.62</div>
  </div>
</body>
</html>
